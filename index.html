<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DeLorean Time Travel Challenge</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #000;
    color: #fff;
    overflow: hidden;
}

#gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;
    background-color: black;
    width: 100%;
    height: 100%;
}

#uiContainer {
    position: absolute;
    top: 10px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 100;
}

#resetButton {
    padding: 8px 15px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

#scoreDisplay {
    color: white;
    font-size: 24px;
    text-shadow: 0 0 5px #00ffff;
}

#accelerateButton {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
    z-index: 100;
    box-shadow: 0 0 10px rgba(46, 204, 113, 0.7);
}

.instructions {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: 14px;
    text-align: center;
    width: 100%;
    max-width: 400px;
}

#highScoreDisplay {
    position: fixed;
    top: 60px;
    right: 20px;
    color: gold;
    font-size: 16px;
    text-shadow: 0 0 3px rgba(255,215,0,0.5);
}
</style>
</head>
<body>
<div id="gameContainer">
    <div id="uiContainer">
        <div id="scoreDisplay">TIME STREAM: 0</div>
        <button id="resetButton">RESET</button>
    </div>
    <div id="highScoreDisplay">HIGH SCORE: 0</div>
    <canvas id="gameCanvas"></canvas>
    <button id="accelerateButton" onmousedown="accelerate(-0.2)" onmouseup="accelerate(0.05)">FLY (HOLD)</button>
    <div class="instructions">
        <p>Hold the FLY button or SPACE key to make your DeLorean ascend</p>
        <p>Avoid the temporal anomalies to stay in the time stream!</p>
    </div>
</div>

<script>
// Game variables
var myGamePiece;
var myObstacles = [];
var gameOver = false;
var highScore = localStorage.getItem('deloreanHighScore') || 0;
document.getElementById('highScoreDisplay').textContent = "HIGH SCORE: " + highScore;

// DeLorean image
var deloreanImg = new Image();
deloreanImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50"><rect x="10" y="20" width="80" height="20" rx="5" fill="%23D4D4D4"/><rect x="15" y="15" width="70" height="5" rx="2" fill="%23A0A0A0"/><rect x="20" y="10" width="60" height="5" rx="2" fill="%23808080"/><circle cx="25" cy="40" r="8" fill="%23111"/><circle cx="75" cy="40" r="8" fill="%23111"/><rect x="60" y="15" width="20" height="10" fill="%23FFD700"/><rect x="65" y="20" width="10" height="5" fill="%23FF4500"/></svg>';

var myGameArea = {
    canvas : document.getElementById("gameCanvas"),
    frameNo : 0,
    start : function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.context = this.canvas.getContext("2d");
        this.interval = setInterval(updateGameArea, 20);
    },
    clear : function() {
        this.context.fillStyle = "black";
        this.context.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Add starfield background
        drawStarfield(this.context);
    },
    stop : function() {
        clearInterval(this.interval);
    }
};

function startGame() {
    myGamePiece = new component(60, 30, deloreanImg, 50, myGameArea.canvas.height/2);
    myGamePiece.gravity = 0.05;
    myGameArea.start();
    gameOver = false;
    myGameArea.frameNo = 0;
    myObstacles = [];
    document.getElementById('scoreDisplay').textContent = "TIME STREAM: 0";
}

function component(width, height, color, x, y, type) {
    this.type = type;
    this.width = width;
    this.height = height;
    this.speedX = 0;
    this.speedY = 0;    
    this.x = x;
    this.y = y;
    this.gravity = 0;
    this.gravitySpeed = 0;
    this.update = function() {
        ctx = myGameArea.context;
        if (this.type == "text") {
            ctx.font = this.width + " " + this.height;
            ctx.fillStyle = color;
            ctx.fillText(this.text, this.x, this.y);
        } else {
            if (color instanceof Image) {
                ctx.drawImage(color, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }
    this.newPos = function() {
        this.gravitySpeed += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY + this.gravitySpeed;
        this.hitBottom();
    }
    this.hitBottom = function() {
        var rockbottom = myGameArea.canvas.height - this.height;
        if (this.y > rockbottom) {
            this.y = rockbottom;
            this.gravitySpeed = 0;
        }
    }
    this.hitTop = function() {
        if (this.y < 0) {
            this.y = 0;
            this.gravitySpeed = 0;
        }
    }
    this.crashWith = function(otherobj) {
        var myleft = this.x;
        var myright = this.x + (this.width);
        var mytop = this.y;
        var mybottom = this.y + (this.height);
        var otherleft = otherobj.x;
        var otherright = otherobj.x + (otherobj.width);
        var othertop = otherobj.y;
        var otherbottom = otherobj.y + (otherobj.height);
        var crash = true;
        if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
            crash = false;
        }
        return crash;
    }
}

// Starfield for background
var stars = [];
function initStarfield() {
    stars = [];
    for (var i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * myGameArea.canvas.width,
            y: Math.random() * myGameArea.canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 2 + 1
        });
    }
}

function drawStarfield(ctx) {
    ctx.fillStyle = "white";
    for (var i = 0; i < stars.length; i++) {
        var star = stars[i];
        ctx.fillRect(star.x, star.y, star.size, star.size);
        
        // Move stars
        star.x -= star.speed;
        if (star.x < 0) {
            star.x = myGameArea.canvas.width;
            star.y = Math.random() * myGameArea.canvas.height;
        }
    }
}

function updateGameArea() {
    if (gameOver) return;
    
    var x, height, gap, minHeight, maxHeight, minGap, maxGap;
    for (i = 0; i < myObstacles.length; i += 1) {
        if (myGamePiece.crashWith(myObstacles[i])) {
            endGame();
            return;
        } 
    }
    myGameArea.clear();
    myGameArea.frameNo += 1;
    
    // Update score display
    document.getElementById('scoreDisplay').textContent = "TIME STREAM: " + myGameArea.frameNo;
    
    // Increase difficulty as score increases
    var obstacleSpeed = -2 - Math.floor(myGameArea.frameNo / 1000);
    var spawnRate = 150 - Math.floor(myGameArea.frameNo / 100); // Increased from 100 to 150 to space out obstacles
    
    if (myGameArea.frameNo == 1 || everyinterval(spawnRate > 50 ? spawnRate : 50)) {
        x = myGameArea.canvas.width;
        minHeight = 50;
        maxHeight = myGameArea.canvas.height/2;
        height = Math.floor(Math.random()*(maxHeight-minHeight+1)+minHeight);
        minGap = 200; // Increased from 100 to 200
        maxGap = 300; // Increased from 200 to 300
        gap = Math.floor(Math.random()*(maxGap-minGap+1)+minGap);
        
        // Create time portal looking obstacles (made them narrower - 20px instead of 30px)
        var topColor = getPortalColor();
        var bottomColor = getPortalColor();
        var topObstacle = new component(20, height, topColor, x, 0); // Width changed from 30 to 20
        var bottomObstacle = new component(20, myGameArea.canvas.height - height - gap, bottomColor, x, height + gap); // Width changed from 30 to 20
        
        myObstacles.push(topObstacle);
        myObstacles.push(bottomObstacle);
    }
    
    for (i = 0; i < myObstacles.length; i += 1) {
        myObstacles[i].x += obstacleSpeed;
        myObstacles[i].update();
    }
    
    // Remove obstacles that are off screen
    myObstacles = myObstacles.filter(obs => obs.x + obs.width > 0);
    
    myGamePiece.newPos();
    myGamePiece.hitTop();
    myGamePiece.update();
    
    // Add speed lines for effect
    drawSpeedLines();
}

function getPortalColor() {
    // Create a time portal gradient effect
    var colors = ["#FF00FF", "#00FFFF", "#FFFF00", "#FF4500", "#9400D3"];
    return colors[Math.floor(Math.random() * colors.length)];
}

function drawSpeedLines() {
    var ctx = myGameArea.context;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
    ctx.lineWidth = 1;
    
    for (var i = 0; i < 30; i++) {
        var x = Math.random() * myGameArea.canvas.width;
        var y = Math.random() * myGameArea.canvas.height;
        var length = 10 + Math.random() * 20;
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - length, y);
        ctx.stroke();
    }
}

function endGame() {
    gameOver = true;
    myGameArea.stop();
    
    // Update high score
    if (myGameArea.frameNo > highScore) {
        highScore = myGameArea.frameNo;
        localStorage.setItem('deloreanHighScore', highScore);
        document.getElementById('highScoreDisplay').textContent = "HIGH SCORE: " + highScore;
        
        // Show new high score message
        var ctx = myGameArea.context;
        ctx.font = "30px Arial";
        ctx.fillStyle = "gold";
        ctx.textAlign = "center";
        ctx.fillText("NEW TIME RECORD!", myGameArea.canvas.width/2, myGameArea.canvas.height/2 - 20);
        ctx.font = "24px Arial";
        ctx.fillText(myGameArea.frameNo + " time units", myGameArea.canvas.width/2, myGameArea.canvas.height/2 + 20);
    } else {
        // Show game over message
        var ctx = myGameArea.context;
        ctx.font = "30px Arial";
        ctx.fillStyle = "red";
        ctx.textAlign = "center";
        ctx.fillText("TIME STREAM COLLAPSE!", myGameArea.canvas.width/2, myGameArea.canvas.height/2 - 20);
        ctx.font = "24px Arial";
        ctx.fillText("You traveled " + myGameArea.frameNo + " time units", myGameArea.canvas.width/2, myGameArea.canvas.height/2 + 20);
    }
}

function resetGame() {
    myGameArea.stop();
    startGame();
}

function everyinterval(n) {
    if ((myGameArea.frameNo / n) % 1 == 0) {return true;}
    return false;
}

function accelerate(n) {
    if (!gameOver) {
        myGamePiece.gravity = n;
    }
}

// Event listeners
document.getElementById('resetButton').addEventListener('click', resetGame);

// Keyboard controls
document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
        accelerate(-0.2);
        e.preventDefault();
    }
});
document.addEventListener('keyup', function(e) {
    if (e.code === 'Space') {
        accelerate(0.05);
    }
});

// Handle window resize
window.addEventListener('resize', function() {
    if (!gameOver) {
        myGameArea.stop();
        myGameArea.canvas.width = window.innerWidth;
        myGameArea.canvas.height = window.innerHeight;
        initStarfield();
        myGameArea.start();
    }
});

// Initialize the game
initStarfield();
startGame();
</script>
</body>
</html>
